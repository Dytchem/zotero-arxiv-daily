name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4
        with:
          enable-cache: true

      - name: Setup node (for Pi agent syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Pi agent syntax check
        run: node --check agent/run.mjs

      - name: Lint
        run: |
          uvx ruff check src/ tests/

      - name: Run Pytest
        run: |
          uv run pytest --cov=src/zotero_arxiv_daily --cov-report=term-missing --cov-fail-under=80
