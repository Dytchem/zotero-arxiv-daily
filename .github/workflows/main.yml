name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache corpus embeddings
        uses: actions/cache@v4
        with:
          path: .cache
          key: corpus-embeddings-${{ github.run_id }}
          restore-keys: corpus-embeddings-

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py

      - name: Send failure notification
        if: failure()
        env:
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: |
          python - <<'PYEOF'
          import os, smtplib
          from email.mime.text import MIMEText

          sender = os.environ["SENDER"]
          receiver = os.environ["RECEIVER"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          body = f"zotero-arxiv-daily workflow failed.\nRun: https://github.com/{repo}/actions/runs/{run_id}"
          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = "[zotero-arxiv-daily] workflow failed"
          msg["From"] = sender
          msg["To"] = receiver
          with smtplib.SMTP_SSL("smtp.qq.com", 465) as s:
              s.login(sender, os.environ["SENDER_PASSWORD"])
              s.sendmail(sender, [receiver], msg.as_string())
          PYEOF
