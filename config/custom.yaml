zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}
  include_path: null # Or set a list of glob patterns, e.g. ["2026/survey/**","2026/reading-group/**"]

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: smtp.qq.com
  smtp_port: 465
  sender_password: ${oc.env:SENDER_PASSWORD}

llm:
  api:
    key: ${oc.env:LLM_API_KEY}
    base_url: https://opencode.ai/zen/go/v1
  generation_kwargs:
    max_tokens: 16384
    model: deepseek-v4-flash
  language: Chinese
  harness:
    enabled: true
    top_k: 100
    full_text_budget: 10
    max_steps: 12
    thinking_level: max
    min_inspections: 3
    max_revisions: 2
    evaluator_enabled: true
    pi_timeout: 86400

source:
  arxiv:
    category: ["quant-ph", "physics.atom-ph", "physics.optics", "physics.chem-ph", "cond-mat.quant-gas", "cond-mat.mes-hall", "cond-mat.str-el", "cond-mat.mtrl-sci", "cond-mat.supr-con", "cs.ET"]
    include_cross_list: false
    lookback_days: 2
    fallback_days: 7

executor:
  debug: ${oc.env:DEBUG,null}
  source: ['arxiv']
  reranker: api
  max_paper_num: 50
  send_empty: true

reranker:
  api:
    key: ${oc.env:RERANKER_API_KEY}
    base_url: https://openrouter.ai/api/v1
    model: qwen/qwen3-embedding-8b
    batch_size: 64
