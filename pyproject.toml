[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[project]
name = "zotero-arxiv-daily"
version = "1.5.5"
description = "Daily arXiv paper recommendations tailored to your Zotero library"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gitignore-parser>=0.1.11",
    "tiktoken>=0.8.0",
    "feedparser>=6.0.11",
    "hydra-core>=1.3.2",
    "aiosmtpd>=1.4.6",
    "loguru>=0.7.3",
    "pyzotero>=1.10.0",
    "openai>=2.24.0",
    "pymupdf4llm>=0.3.4",
    "pymupdf-layout>=1.27.1",
    "dotenv>=0.9.9",
    "trafilatura>=2.0.0",
]

[project.optional-dependencies]
local-reranker = [
    "scikit-learn>=1.7.1",
    "sentence-transformers>=5.2.3",
    "torch",
    "peft>=0.18.1",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: tests that are slow (e.g. download models)",
]
filterwarnings = [
    "ignore::DeprecationWarning:multiprocessing",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "UP047", "RUF001"]

[tool.ruff.lint.per-file-ignores]
# HTML email templates: inline styles cannot be wrapped without breaking them
"src/zotero_arxiv_daily/construct_email.py" = ["E501"]
# LaTeX/PDF extraction regexes and long comments
"src/zotero_arxiv_daily/utils.py" = ["E501"]
# test fixtures / long regexes
"tests/**" = ["E501", "RUF043"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.0",
]
